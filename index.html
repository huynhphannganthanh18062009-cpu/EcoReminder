<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoReminder — Hành động nhỏ, thói quen xanh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Các thư viện Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#F6F7F0;
  --surface:#FFFFFF;
  --ink:#1D2A20;
  --ink-soft:#51604F;
  --line:#DEE4D6;
  --moss:#2F6B4F;
  --moss-dark:#1F4C37;
  --moss-pale:#E4EEE3;
  --amber:#D9A441;
  --amber-pale:#F6E7C4;
  --clay:#B4552F;
  --clay-pale:#F3DCCB;
  --sky:#3D7A8C;
  --radius-s:6px;
  --radius-m:12px;
  --radius-l:20px;
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body.dark{
  --bg:#141B15;
  --surface:#1D251E;
  --ink:#EAF1E7;
  --ink-soft:#A9B7A5;
  --line:#33402F;
  --moss-pale:#22321F;
  --amber-pale:#3A311C;
  --clay-pale:#3A241A;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;color:var(--ink);}
p{margin:0;color:var(--ink-soft);line-height:1.55;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
a{color:inherit;}
.hidden{display:none !important;}
::selection{background:var(--moss-pale);}

/* ---------- Layout shell ---------- */
#app{max-width:1180px;margin:0 auto;padding-bottom:88px;min-height:100vh;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 10px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:38px;height:38px;border-radius:10px;background:var(--moss);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.brand-mark svg{width:20px;height:20px;}
.brand-name{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:.2px;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;justify-content:center;
}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink);}

.view{padding:6px 20px 20px;}
.view-header{margin-bottom:16px;}
.view-header h2{font-size:24px;}
.view-header p{margin-top:4px;font-size:14px;}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  padding:18px;
}
.card + .card{margin-top:14px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:999px;border:none;font-weight:600;font-size:14.5px;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--moss);color:#fff;}
.btn-primary:hover{background:var(--moss-dark);}
.btn-ghost{background:transparent;color:var(--moss);border:1.5px solid var(--moss);}
.btn-soft{background:var(--moss-pale);color:var(--moss-dark);}
.btn-amber{background:var(--amber);color:#3A2A08;}
.btn-clay{background:var(--clay-pale);color:var(--clay);}
.btn-block{width:100%;}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:999px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 4px 10px;
  z-index:40;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--ink-soft);font-size:11px;font-weight:600;
  padding:6px 8px;border-radius:10px;flex:1;max-width:110px;
}
.nav-item svg{width:21px;height:21px;stroke:var(--ink-soft);fill:none;}
.nav-item.active{color:var(--moss);}
.nav-item.active svg{stroke:var(--moss);}
@media(min-width:860px){
  .bottom-nav{
    position:sticky;top:0;left:auto;right:auto;flex-direction:row;justify-content:flex-start;
    gap:6px;border-top:none;border-bottom:1px solid var(--line);padding:10px 20px;margin-bottom:6px;
  }
  .nav-item{flex-direction:row;max-width:none;flex:none;padding:8px 14px;}
  #app{padding-bottom:20px;}
}

/* ---------- Progress ---------- */
.progress-track{height:8px;border-radius:99px;background:var(--moss-pale);overflow:hidden;}
.progress-fill{height:100%;background:var(--moss);border-radius:99px;transition:width .4s ease;}
.progress-track.amber{background:var(--amber-pale);}
.progress-track.amber .progress-fill{background:var(--amber);}

/* ---------- Onboarding ---------- */
#onboarding{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.ob-card{max-width:560px;width:100%;}
.ob-hero{
  background:linear-gradient(160deg,var(--moss) 0%,var(--moss-dark) 100%);
  color:#fff;border-radius:var(--radius-l);padding:38px 30px;text-align:left;position:relative;overflow:hidden;
}
.ob-hero::after{
  content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;
  border-radius:50%;background:rgba(255,255,255,.08);
}
.ob-leaf{font-size:34px;line-height:1;margin-bottom:16px;display:inline-block;}
.ob-hero h1{color:#fff;font-size:30px;line-height:1.28;max-width:420px;}
.ob-hero p{color:rgba(255,255,255,.82);margin-top:14px;font-size:15px;max-width:400px;}
.ob-actions{display:flex;gap:10px;margin-top:26px;}
.ob-steps{display:flex;flex-direction:column;gap:14px;margin-top:22px;}
.ob-step{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;}
.ob-step-num{
  width:30px;height:30px;border-radius:50%;background:var(--moss-pale);color:var(--moss-dark);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;
}
.field{margin-bottom:16px;}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:7px;}
.field input[type=text],.field select,.field textarea{
  width:100%;padding:11px 13px;border-radius:var(--radius-s);border:1.5px solid var(--line);
  font-size:14.5px;background:var(--surface);color:var(--ink);
}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);
  font-size:13.5px;font-weight:600;color:var(--ink-soft);
}
.chip.selected{border-color:var(--moss);background:var(--moss-pale);color:var(--moss-dark);}
.chip small{display:block;font-weight:400;color:var(--ink-soft);font-size:11.5px;margin-top:2px;}

/* ---------- Survey ---------- */
.survey-progress-wrap{padding:14px 20px 0;}
.survey-progress-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
.likert-q{border-bottom:1px solid var(--line);padding:16px 0;}
.likert-q:last-child{border-bottom:none;}
.likert-q p.qtext{color:var(--ink);font-size:14.5px;font-weight:500;margin-bottom:12px;}
.likert-scale{display:flex;gap:6px;}
.likert-opt{
  flex:1;padding:9px 4px;text-align:center;border-radius:var(--radius-s);border:1.5px solid var(--line);
  font-size:12px;font-weight:600;color:var(--ink-soft);
}
.likert-opt .num{display:block;font-family:var(--font-display);font-size:16px;font-weight:600;}
.likert-opt.selected{background:var(--moss);border-color:var(--moss);color:#fff;}
.scenario-opt{
  display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--radius-m);
  border:1.5px solid var(--line);background:var(--surface);margin-bottom:10px;font-size:14px;color:var(--ink);
}
.scenario-opt b{color:var(--moss-dark);margin-right:8px;}
.scenario-opt.selected{border-color:var(--moss);background:var(--moss-pale);}
.check-list label{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.check-list label:last-child{border-bottom:none;}
.check-list input{margin-top:3px;}
.survey-nav{display:flex;gap:10px;justify-content:space-between;padding:18px 0 4px;}

/* ---------- Dashboard ---------- */
.greet-card{background:linear-gradient(160deg,var(--moss) 0%,var(--moss-dark) 100%);color:#fff;border:none;}
.greet-card h2{color:#fff;font-size:22px;}
.greet-card p{color:rgba(255,255,255,.82);margin-top:4px;}
.stat-row{display:flex;gap:10px;margin-top:18px;}
.stat-pill{flex:1;background:rgba(255,255,255,.12);border-radius:var(--radius-m);padding:12px;}
.stat-pill .v{font-family:var(--font-display);font-size:22px;font-weight:600;}
.stat-pill .l{font-size:11.5px;color:rgba(255,255,255,.78);margin-top:2px;}

.metric-card{text-align:center;}
.metric-card .big{font-family:var(--font-display);font-size:30px;font-weight:600;}
.metric-card .lab{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-weight:600;}
.gap-pos{color:var(--clay);}
.gap-neg{color:var(--moss);}
.gap-neutral{color:var(--sky);}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
.section-title h3{font-size:16.5px;}
.section-title a,.link-btn{font-size:13px;font-weight:600;color:var(--moss);border:none;background:none;}

.task-card{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);}
.task-card:last-child{border-bottom:none;}
.task-badge{
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:16px;
}
.task-badge.easy{background:var(--moss-pale);}
.task-badge.medium{background:var(--amber-pale);}
.task-badge.hard{background:var(--clay-pale);}
.task-main{flex:1;min-width:0;}
.task-main h4{font-size:14.5px;font-weight:600;}
.task-meta{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;}
.tag{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);padding:2px 8px;border-radius:99px;}
.task-actions{display:flex;gap:8px;margin-top:10px;}
.task-done-badge{font-size:12px;font-weight:700;color:var(--moss);display:flex;align-items:center;gap:5px;}
.task-done-badge.no{color:var(--clay);}

.barrier-card{display:flex;gap:12px;align-items:center;}
.barrier-icon{width:40px;height:40px;border-radius:10px;background:var(--clay-pale);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

/* ---------- Journal ---------- */
.journal-entry{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.journal-entry:last-child{border-bottom:none;}
.journal-date{width:52px;flex-shrink:0;text-align:center;}
.journal-date .d{font-family:var(--font-display);font-size:19px;font-weight:600;}
.journal-date .m{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;font-weight:700;}
.journal-photo{width:100%;max-width:220px;border-radius:var(--radius-s);margin-top:8px;display:block;}

.tab-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px;}
.tab-pill{
  padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;flex-shrink:0;
}
.tab-pill.active{background:var(--moss);color:#fff;border-color:var(--moss);}

/* ---------- Progress tab ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px;}
.badge-tile{text-align:center;padding:12px 6px;border-radius:var(--radius-m);border:1.5px dashed var(--line);}
.badge-tile.unlocked{border-style:solid;border-color:var(--amber);background:var(--amber-pale);}
.badge-tile .em{font-size:26px;}
.badge-tile .n{font-size:10.5px;font-weight:700;margin-top:5px;color:var(--ink-soft);line-height:1.25;}
.badge-tile.unlocked .n{color:var(--ink);}

.bar-chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px;}
.bar-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.bar-chart .bar{width:100%;background:var(--moss);border-radius:6px 6px 0 0;min-height:3px;}
.bar-chart .lbl{font-size:10px;color:var(--ink-soft);font-weight:700;}

.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.hbar-label{width:120px;flex-shrink:0;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.hbar-track{flex:1;height:10px;border-radius:99px;background:var(--bg);overflow:hidden;}
.hbar-fill{height:100%;background:var(--clay);border-radius:99px;}
.hbar-val{width:26px;font-size:12px;font-weight:700;text-align:right;}

.challenge-day{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;background:var(--bg);border:1.5px solid var(--line);color:var(--ink-soft);}
.challenge-day.done{background:var(--moss);color:#fff;border-color:var(--moss);}
.challenge-day.today{border-color:var(--amber);}
.challenge-days{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}

/* ---------- Knowledge / lessons ---------- */
.lesson-card{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.lesson-card:last-child{border-bottom:none;}
.lesson-num{width:34px;height:34px;border-radius:9px;background:var(--moss-pale);color:var(--moss-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-display);flex-shrink:0;}
.lesson-body h4{font-size:14.5px;}
.lesson-body p{font-size:12.5px;margin-top:2px;}
.lesson-detail-block{margin-bottom:16px;}
.lesson-detail-block h4{font-size:13px;text-transform:none;color:var(--moss-dark);margin-bottom:6px;}
.lesson-detail-block p{font-size:14px;color:var(--ink);}
.myth-row{display:flex;gap:10px;margin-bottom:8px;font-size:13px;}
.myth-row .no{color:var(--clay);font-weight:700;flex-shrink:0;width:70px;}
.myth-row .yes{color:var(--moss-dark);font-weight:700;flex-shrink:0;width:70px;}

/* ---------- Games ---------- */
.eco-sort-board{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}
.sort-bin{border:2px dashed var(--line);border-radius:var(--radius-m);padding:12px;text-align:center;min-height:70px;}
.sort-bin.target{border-color:var(--moss);}
.sort-item-pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.sort-item{padding:9px 12px;border-radius:999px;background:var(--amber-pale);border:1.5px solid var(--amber);font-size:13px;font-weight:600;}
.sort-item.selected{background:var(--amber);color:#3A2A08;}
.tree-stage{font-size:70px;text-align:center;margin:6px 0;}

/* ---------- Modal / toast ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,27,21,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
@media(min-width:640px){.modal-backdrop{align-items:center;}}
.modal-sheet{background:var(--surface);border-radius:20px 20px 0 0;max-width:520px;width:100%;padding:22px 20px 26px;max-height:88vh;overflow-y:auto;}
@media(min-width:640px){.modal-sheet{border-radius:var(--radius-l);}}
.modal-sheet h3{margin-bottom:14px;}
.reason-opt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:var(--radius-s);border:1.5px solid var(--line);margin-bottom:8px;font-size:13.5px;background:var(--surface);}
.reason-opt.selected{border-color:var(--moss);background:var(--moss-pale);}

.toast-stack{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px);}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--radius-m);font-size:13.5px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.18);display:flex;gap:10px;align-items:center;}
body.dark .toast{background:var(--surface);color:var(--ink);border:1px solid var(--line);}

.empty-state{text-align:center;padding:30px 10px;}
.empty-state .em{font-size:30px;margin-bottom:8px;}
.empty-state p{font-size:13.5px;}
.notice-banner{display:flex;gap:12px;align-items:flex-start;background:var(--amber-pale);border:1px solid var(--amber);border-radius:var(--radius-m);padding:14px;margin-bottom:14px;}
.notice-banner p{color:var(--ink);font-size:13.5px;}

footer.spec-note{padding:20px;text-align:center;}
footer.spec-note p{font-size:11.5px;}
</style>
</head>
<body>

<div class="toast-stack" id="toastStack"></div>

<!-- ========== ONBOARDING ========== -->
<div id="onboarding"></div>

<!-- ========== MAIN APP ========== -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 22V12M12 12C12 7 8 3 3 3c0 5 4 9 9 9zm0 0c0-5 4-9 9-9 0 5-4 9-9 9z"/></svg>
      </div>
      <span class="brand-name">EcoReminder</span>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" title="Đổi giao diện">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <button class="btn btn-soft btn-sm" onclick="loginWithGoogle()">
  🔑 Đăng nhập Google
</button>
    </div>
  </div>

  <div style="padding:0 20px;">
    <div class="bottom-nav" id="topNavDesktop" style="display:none;"></div>
  </div>

  <div id="viewHome" class="view"></div>
  <div id="viewTasks" class="view hidden"></div>
  <div id="viewJournal" class="view hidden"></div>
  <div id="viewProgress" class="view hidden"></div>
  <div id="viewProfile" class="view hidden"></div>

  <footer class="spec-note"><p>EcoReminder · bản thử nghiệm · dữ liệu lưu trên trình duyệt của bạn (LocalStorage)</p></footer>
</div>

<div class="bottom-nav" id="bottomNav"></div>
<div id="modalRoot"></div>

<script>
  // Cấu hình Firebase
const firebaseConfig = {
    apiKey: "AIzaSyD8pf7nPWKtQ1ouT1DZ8VlD409zfRCuz50",
    authDomain: "tim-hieu-ve-ecoreminder.firebaseapp.com",
    projectId: "tim-hieu-ve-ecoreminder",
    storageBucket: "tim-hieu-ve-ecoreminder.firebasestorage.app",
    messagingSenderId: "204176166773",
    appId: "1:204176166773:web:0b1d8d782ebf42c3294d3c",
    measurementId: "G-7CBSN2H29H"
  };


// Khởi tạo Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// Biến lưu thông tin người dùng hiện tại
let currentUser = null;

// Lắng nghe trạng thái đăng nhập (Tự động đăng nhập ẩn danh nếu chưa đăng nhập)
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    console.log("Đã đăng nhập thành công với UID:", user.uid, "Ẩn danh:", user.isAnonymous);
  } else {
    // Nếu chưa đăng nhập -> Tự động tạo phiên đăng nhập ẩn danh
    try {
      await auth.signInAnonymously();
    } catch (error) {
      console.error("Lỗi đăng nhập ẩn danh:", error);
    }
  }

// Hàm gọi khi người dùng bấm nút "Đăng nhập bằng Google"
async function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    // Nếu đang dùng tài khoản ẩn danh, linkWithPopup sẽ nâng cấp tài khoản ẩn danh thành tài khoản Google (giữ nguyên dữ liệu)
    if (auth.currentUser && auth.currentUser.isAnonymous) {
      await auth.currentUser.linkWithPopup(provider);
      toast("Đã liên kết thành công với tài khoản Google!", "🎉");
    } else {
      await auth.signInWithPopup(provider);
      toast("Đăng nhập Google thành công!", "🎉");
    }
    if (typeof render === "function") render(); // Cập nhật lại giao diện
  } catch (error) {
    console.error("Lỗi đăng nhập Google:", error);
    toast("Đăng nhập thất bại: " + error.message, "⚠️");
  }
}

/* ---------------- Toast ---------------- */
function toast(msg, icon){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className='toast';
  el.innerHTML = `<span>${icon||'🌱'}</span><span>${msg}</span>`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}

/* =========================================================================
   COMPUTATION HELPERS
   ========================================================================= */
function avg(arr){ if(!arr.length) return 0; return arr.reduce((a,b)=>a+b,0)/arr.length; }
function pct(avgVal){ return Math.round((avgVal/5)*1000)/10; }
function levelOf(points){ let cur=LEVELS[0]; for(const l of LEVELS){ if(points>=l.min) cur=l; } return cur; }
function nextLevel(points){ for(const l of LEVELS){ if(points<l.min) return l; } return null; }

function computeSurveyScores(answers){
  const p1 = P1_TEXT.map((_,i)=>answers['p1_'+i]||0);
  const p2 = P2_TEXT.map((_,i)=>answers['p2_'+i]||0);
  const p3 = P3_TEXT.map((_,i)=>answers['p3_'+i]||0);
  const intent = P_INTENT_TEXT.map((_,i)=>answers['intent_'+i]||0);
  const awarenessScore = pct(avg(p1));
  const behaviorScore = pct(avg(p2));
  const intentionScore = pct(avg(intent));
  const gap = Math.round((intentionScore - behaviorScore)*10)/10;
  // barrier scoring from part3 + checklist
  const barrierMap = {};
  BARRIER_KEYS.forEach((k,i)=>{ barrierMap[k] = p3[i]||0; });
  const checklist = answers.barriers_checked || [];
  checklist.forEach(k=>{ if(barrierMap[k]!==undefined) barrierMap[k]+=1; });
  const topBarriers = Object.entries(barrierMap).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  // scenario profile
  const counts = {A:0,B:0,C:0,D:0};
  (answers.scenario_answers||[]).forEach(letter=>{ if(counts[letter]!==undefined) counts[letter]++; });
  let scenarioProfile = 'B';
  let max=-1;
  Object.entries(counts).forEach(([k,v])=>{ if(v>max){ max=v; scenarioProfile=k; } });
  return {awarenessScore, behaviorScore, intentionScore, gap, barrierMap, topBarriers, scenarioCounts:counts, scenarioProfile};
}
function level5(x){ return x<50?'Thấp':(x<75?'Trung bình':'Cao'); }
const SCENARIO_LABEL = {A:'Hành động chưa thay đổi', B:'Có ý thức nhưng chưa hành động', C:'Hành động tích cực', D:'Hành động và lan tỏa'};

let _lastLevelName = null;

  if(lv !== _lastLevelName){

function markDayActive(){
  const t = todayStr();
  if(state.streak.lastActiveDate === t) return; // already counted today
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  const yestStr = yest.getFullYear()+'-'+String(yest.getMonth()+1).padStart(2,'0')+'-'+String(yest.getDate()).padStart(2,'0');
  if(state.streak.lastActiveDate === yestStr){ state.streak.current += 1; }
  else { state.streak.current = 1; }
  if(state.streak.current > state.streak.longest) state.streak.longest = state.streak.current;
  state.streak.lastActiveDate = t;
  persist('streak');
  if(state.streak.current===3) unlockBadge('streak3');
}

  if(state.badges.includes(id)) return;
  state.badges.push(id);
  persist('badges');

/* =========================================================================
   TASKS
   ========================================================================= */
function getTodayTasks(){
  const t = todayStr();
  if(!state.tasks.byDate[t]) generateDailyTasks(t);
  return state.tasks.byDate[t];
}
function recentTaskIds(days){
  const ids = new Set();
  const d = new Date();
  for(let i=1;i<=days;i++){
    const dd = new Date(d); dd.setDate(dd.getDate()-i);
    const key = dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
    const arr = state.tasks.byDate[key];
    if(arr) arr.forEach(x=>ids.add(x.taskId));
  }
  return ids;
}
function generateDailyTasks(dateKey){
  const profile = state.profile;
  const survey = state.surveyInitial;
  const topBarriers = survey ? survey.topBarriers : [];
  const goals = profile ? profile.goals : [];
  const avoid = recentTaskIds(2);
  function score(task){
    let s = 0;
    task.barriers.forEach(b=>{ if(topBarriers.includes(b)) s+=3; });
    task.goals.forEach(g=>{ if(goals.includes(g)) s+=2; });
    if(avoid.has(task.id)) s -= 5;
    s += Math.random();
    return s;
  }
  function pick(diff, excludeIds){
    const pool = TASK_POOL.filter(t=>t.diff===diff && !excludeIds.includes(t.id));
    if(!pool.length) return null;
    pool.sort((a,b)=>score(b)-score(a));
    return pool[0];
  }
  const main = pick('easy', []) || TASK_POOL[0];
  const secondary = pick('medium', [main.id]) || TASK_POOL[1];
  const bonus = pick('hard', [main.id, secondary.id]) || TASK_POOL[2];
  const list = [main, secondary, bonus].map((t,i)=>({
    instId: uid(), taskId:t.id, title:t.title, diff:t.diff, cat:t.cat, est:t.est, barriers:t.barriers,
    points: DIFF_POINTS[t.diff], slot: i===0?'Nhiệm vụ chính':(i===1?'Nhiệm vụ phụ':'Nhiệm vụ Bonus'),
    status:'pending', failureReason:null, note:null,
  }));
  state.tasks.byDate[dateKey] = list;
  persist('tasks');
}
function replaceTask(dateKey, instId){
  const list = state.tasks.byDate[dateKey];
  const idx = list.findIndex(x=>x.instId===instId);
  if(idx<0) return;
  const cur = list[idx];
  const usedIds = list.map(x=>x.taskId);
  const pool = TASK_POOL.filter(t=>t.diff===cur.diff && !usedIds.includes(t.id));
  if(!pool.length){ toast('Không còn nhiệm vụ khác cùng mức độ để đổi.', 'ℹ️'); return; }
  const t = pool[Math.floor(Math.random()*pool.length)];
  list[idx] = {instId:uid(), taskId:t.id, title:t.title, diff:t.diff, cat:t.cat, est:t.est, barriers:t.barriers,
    points:DIFF_POINTS[t.diff], slot:cur.slot, status:'replaced_from', originalTitle:cur.title, failureReason:null, note:null};
  persist('tasks');
  render();
}
function completeTask(dateKey, instId){
  const list = state.tasks.byDate[dateKey];
  const item = list.find(x=>x.instId===instId);
  if(!item || item.status==='completed') return;
  item.status='completed';
  persist('tasks');
  addPoints(item.points, 'Nhiệm vụ: '+item.title);
  addGrowthPoints(10);
  markDayActive();
  updateCategoryBadges();
  updateCommitmentChecks(item);
  toast('Bạn đã hoàn thành nhiệm vụ hôm nay!', '✅');
  unlockBadge('firstTask');
  render();
}
function markNotCompleted(dateKey, instId, reason, note){
  const list = state.tasks.byDate[dateKey];
  const item = list.find(x=>x.instId===instId);
  if(!item) return;
  item.status='not_completed';
  item.failureReason = reason;
  item.note = note||null;
  persist('tasks');
  render();
}
function updateCategoryBadges(){
  let reuse=0, reduce=0;
  Object.values(state.tasks.byDate).forEach(list=>{
    list.forEach(t=>{
      if(t.status==='completed'){
        if(t.cat==='taisudung') reuse++;
        if(t.cat==='nhua1lan') reduce++;
        if(t.taskId==='t19') unlockBadge('inspirer');
      }
    });
  });
  if(reuse>=5) unlockBadge('reuser');
  if(reduce>=5) unlockBadge('reducer');
}

        <p style="color:rgba(255,255,255,.75);font-size:11.5px;margin-top:6px;">${next? (next.min-state.points.total)+' điểm nữa để lên '+next.name : 'Bạn đã ở cấp bậc cao nhất!'}</p>

function taskCardHTML(t){
  const icon = t.diff==='easy'?'🍃':(t.diff==='medium'?'🌿':'🌳');
  let actions = '';
  if(t.status==='pending' || t.status==='replaced_from'){
    actions = `<div class="task-actions">
      <button class="btn btn-primary btn-sm" onclick="completeTask('${todayStr()}','${t.instId}')">Hoàn thành</button>
      <button class="btn btn-ghost btn-sm" onclick="openFailureModal('${t.instId}')">Chưa thực hiện</button>
    </div>`;
  } else if(t.status==='completed'){
    actions = `<div class="task-done-badge">✔ Đã hoàn thành · +${t.points} điểm</div>`;
  } else if(t.status==='not_completed'){
    const r = FAILURE_REASONS.find(x=>x.id===t.failureReason);
    actions = `<div class="task-done-badge no">✕ Chưa thực hiện — ${r?r.label:''}</div><p style="font-size:12px;margin-top:4px;">${r?r.hint:''}</p>`;
  }
  return `<div class="task-card">
    <div class="task-badge ${t.diff}">${icon}</div>
    <div class="task-main">
      <h4>${t.title}</h4>
      <div class="task-meta"><span class="tag">${t.slot}</span><span class="tag">${t.est}</span><span class="tag">+${t.points} điểm</span></div>
      ${actions}
    </div>
  </div>`;
}
function challengeSummaryHTML(){
  const active = state.challenges.active;
  if(!active.length) return `<div class="empty-state"><div class="em">🏁</div><p>Bạn chưa tham gia thử thách nào. Hãy bắt đầu ở tab Tiến trình!</p></div>`;
  return active.map(c=>{
    const total = c.progress.length;
    const done = c.progress.filter(Boolean).length;
    return `<div style="padding:10px 0;border-bottom:1px solid var(--line);">
      <div style="display:flex;justify-content:space-between;"><h4 style="font-size:14px;">${challengeName(c.type)}</h4><span style="font-size:12.5px;font-weight:700;color:var(--moss);">${done}/${total} ngày</span></div>
      <div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:${(done/total)*100}%;"></div></div>
    </div>`;
  }).join('');
}
function challengeName(type){ return {c7:'Green Starter · 7 ngày', c14:'Green Habit · 14 ngày', c30:'Eco Lifestyle · 30 ngày'}[type]||type; }

  const file = fileInput.files[0];
  function finish(photo){
    addJournalEntry({action, note, barrier: barrier||null, free:true, photo: photo||null,
      points: (state.journal.filter(j=>j.date===todayStr()&&j.free).length<3)?5:0});
    markDayActive();
    const willEarn = state.journal.filter(j=>j.date===todayStr()&&j.free).length<=3;
    render(); switchTab('journal'); journalSubTab='log'; renderJournalView();
    toast('Đã ghi nhận hành động của bạn!', '🌿');
  }
  if(file){
    const reader = new FileReader();
    reader.onload = e=>finish(e.target.result);
    reader.readAsDataURL(file);
  } else { finish(null); }
}

let sortState = null;
function renderEcoSort(c){
  if(!sortState){
    const items = [...SORT_ITEMS].sort(()=>Math.random()-.5).slice(0,10).map((x,i)=>({...x, id:i, done:false}));
    sortState = {items, selected:null, correct:0, wrong:0};
  }
  const remaining = sortState.items.filter(x=>!x.done);
  c.innerHTML = `
    <p style="font-size:13px;margin-bottom:6px;">Chọn một vật phẩm rồi bấm đúng thùng chứa. Đúng ${sortState.correct} · Sai ${sortState.wrong}</p>
    <div class="eco-sort-board">${SORT_BINS.map(b=>`<div class="sort-bin ${sortState.selected!==null?'target':''}" onclick="ecoSortDrop('${b.id}')"><div style="font-size:22px;">${b.em}</div><div style="font-size:12px;font-weight:700;margin-top:4px;">${b.label}</div></div>`).join('')}</div>
    <div class="sort-item-pool">${remaining.map(it=>`<button class="sort-item ${sortState.selected===it.id?'selected':''}" onclick="ecoSortSelect(${it.id})">${it.n}</button>`).join('')}</div>
    ${remaining.length===0?`<div style="margin-top:14px;text-align:center;">
      <p style="font-weight:700;color:var(--moss-dark);">Hoàn thành! Độ chính xác: ${Math.round((sortState.correct/(sortState.correct+sortState.wrong||1))*100)}%</p>
      <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="claimEcoSortReward()">Nhận thưởng</button>
      <button class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="sortState=null; renderGameSub();">Chơi lại</button>
    </div>`:''}
  `;
}
function ecoSortSelect(id){ sortState.selected = (sortState.selected===id)?null:id; renderGameSub(); }
function ecoSortDrop(binId){
  if(sortState.selected===null){ toast('Hãy chọn một vật phẩm trước.', 'ℹ️'); return; }
  const item = sortState.items.find(x=>x.id===sortState.selected);
  if(!item) return;
  if(item.bin===binId){ sortState.correct++; toast(item.n+' — chính xác!', '✅'); }
  else { sortState.wrong++; toast(item.n+' thuộc nhóm khác đó!', '❌'); }
  item.done = true; sortState.selected = null;
  renderGameSub();
}
function claimEcoSortReward(){
  const t = todayStr();
  const acc = sortState.correct/(sortState.correct+sortState.wrong||1);
  if(state.games.ecoSortLastReward===t){ toast('Bạn đã nhận thưởng Eco Sort hôm nay rồi.', 'ℹ️'); return; }
  if(acc>=0.9){ addPoints(10,'Eco Sort — độ chính xác cao'); state.games.ecoSortLastReward=t; persist('games'); toast('Tuyệt vời! +10 Eco Point','🎉'); }
  else { toast('Cần độ chính xác từ 90% trở lên để nhận thưởng. Thử lại nhé!','ℹ️'); }
  markDayActive(); render();
}

  else if(progressSubTab==='commitments') renderCommitments(c);
  else if(progressSubTab==='badges') renderBadgesTab(c);
  else if(progressSubTab==='knowledge') renderKnowledgeTab(c);

function renderStats(c){
  // completion trend last 7 days
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const list = state.tasks.byDate[key]||[];
    const done = list.filter(t=>t.status==='completed').length;
    days.push({key, done, label:d.toLocaleDateString('vi-VN',{weekday:'short'}).replace('Th ','T')});
  }
  const maxDone = Math.max(1, ...days.map(d=>d.done));
  const hasAnyTask = Object.keys(state.tasks.byDate).length>0;

  // barrier frequency from not_completed reasons
  const reasonCounts = {};
  Object.values(state.tasks.byDate).flat().forEach(t=>{ if(t.status==='not_completed'){ reasonCounts[t.failureReason]=(reasonCounts[t.failureReason]||0)+1; } });
  const reasonEntries = Object.entries(reasonCounts).sort((a,b)=>b[1]-a[1]);
  const maxReason = Math.max(1, ...reasonEntries.map(e=>e[1]));

  let compareBlock = '';
  if(state.surveyInitial && state.surveyPost){
    const a = state.surveyInitial, b = state.surveyPost;
    compareBlock = `<div class="card">
      <h3 style="font-size:15px;margin-bottom:12px;">So sánh trước / sau</h3>
      ${['intentionScore','behaviorScore'].map(k=>{
        const label = k==='intentionScore'?'Ý định':'Hành động';
        return `<div class="hbar-row"><div class="hbar-label">${label} (trước)</div><div class="hbar-track"><div class="hbar-fill" style="width:${a[k]}%;background:var(--sky);"></div></div><div class="hbar-val">${a[k]}%</div></div>
        <div class="hbar-row"><div class="hbar-label">${label} (sau)</div><div class="hbar-track"><div class="hbar-fill" style="width:${b[k]}%;"></div></div><div class="hbar-val">${b[k]}%</div></div>`;
      }).join('')}
      <p style="font-size:12.5px;margin-top:8px;">Khoảng cách Ý định–Hành động: ${a.gap}% → ${b.gap}% ${b.gap<a.gap?'(đã thu hẹp 🎉)':''}</p>
    </div>`;
  } else if(state.surveyInitial){
    compareBlock = `<div class="card"><div class="empty-state"><div class="em">📊</div><p>Chưa đủ dữ liệu để thống kê. Hãy tiếp tục ghi nhận các hành động của bạn nhé!</p>
      <button class="btn btn-soft btn-sm" style="margin-top:10px;" onclick="startSurvey('post')">Làm khảo sát sau</button></div></div>`;
  }

  c.innerHTML = `
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px;">Nhiệm vụ hoàn thành — 7 ngày qua</h3>
      ${hasAnyTask ? `<div class="bar-chart">${days.map(d=>`<div class="col"><div class="bar" style="height:${(d.done/maxDone)*90+6}px;"></div><div class="lbl">${d.label}</div></div>`).join('')}</div>`
        : `<div class="empty-state"><div class="em">📈</div><p>Chưa đủ dữ liệu để thống kê. Hãy tiếp tục ghi nhận các hành động của bạn nhé!</p></div>`}
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:10px;">Rào cản gặp phải nhiều nhất</h3>
      ${reasonEntries.length? reasonEntries.map(([id,count])=>{
        const r = FAILURE_REASONS.find(x=>x.id===id);
        return `<div class="hbar-row"><div class="hbar-label">${r?r.label:id}</div><div class="hbar-track"><div class="hbar-fill" style="width:${(count/maxReason)*100}%;"></div></div><div class="hbar-val">${count}</div></div>`;
      }).join('') : `<div class="empty-state"><div class="em">🧩</div><p>Chưa đủ dữ liệu để thống kê. Hãy tiếp tục ghi nhận các hành động của bạn nhé!</p></div>`}
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:6px;">Eco Point tích lũy</h3>
      <div class="metric-card" style="text-align:left;"><div class="big" style="font-size:26px;">${state.points.total}</div><div class="lab">Kỷ lục Streak: ${state.streak.longest} ngày · Huy hiệu: ${state.badges.length}/${BADGES_DEF.length}</div></div>
    </div>
    ${compareBlock}
  `;
}

    {type:'c14', name:'Green Habit', days:14, desc:'Nâng dần độ khó, xây thói quen bền hơn.', reward:60},
    {type:'c30', name:'Eco Lifestyle', days:30, desc:'Reduce → Reuse → Recycle → Influence.', reward:100},
  ];
  c.innerHTML = types.map(ch=>{
    const active = state.challenges.active.find(a=>a.type===ch.type);
    let body;
    if(active){
      body = `<div class="challenge-days">${active.progress.map((done,i)=>`<div class="challenge-day ${done?'done':''} ${i===active.progress.filter(Boolean).length?'today':''}">${i+1}</div>`).join('')}</div>

}
function startChallenge(type, days){
  state.challenges.active.push({id:uid(), type, startDate:todayStr(), progress:new Array(days).fill(false), completed:false});
  persist('challenges');
  toast('Thử thách đã bắt đầu — cố lên nhé!', '🚀');
  renderProgressSub();
}
function checkChallengeDay(type){
  const c = state.challenges.active.find(a=>a.type===type);
  if(!c || c.completed) return;
  const idx = c.progress.findIndex(x=>!x);
  if(idx<0) return;
  c.progress[idx] = true;
  markDayActive();
  addGrowthPoints(5);
  if(c.progress.every(Boolean)){
    c.completed = true;
    const rewardMap = {c7:30, c14:60, c30:100};
    addPoints(rewardMap[type], 'Hoàn thành thử thách '+challengeName(type));
    addGrowthPoints(25);
    if(type==='c7') unlockBadge('green7');
    if(type==='c14') unlockBadge('habit14');
    if(type==='c30') unlockBadge('sustain30');
    toast('Chúc mừng! Bạn đã hoàn thành thử thách!', '🏆');
  } else { toast('Đã đánh dấu ngày hôm nay!', '✅'); }
  persist('challenges');
  renderProgressSub();
}

function createCommitments(optionsStr){
  const options = optionsStr.split('|');
  const checked = Array.from(document.querySelectorAll('#commitOptions input:checked')).map(x=>parseInt(x.value));
  if(!checked.length){ toast('Hãy chọn ít nhất một cam kết.', '⚠️'); return; }
  if(checked.length>3){ toast('Chỉ chọn tối đa 3 cam kết.', '⚠️'); return; }
  const duration = parseInt(document.getElementById('commitDuration').value);
  checked.forEach(i=>{
    state.challenges.commitments.push({id:uid(), text:options[i], duration, startDate:todayStr(), checks:new Array(duration).fill(false), completed:false});
  });
  persist('challenges');
  toast('Đã tạo cam kết mới!', '🤝');
  renderProgressSub();
}
function checkCommitment(id){
  const cm = state.challenges.commitments.find(x=>x.id===id);
  if(!cm || cm.completed) return;
  const idx = cm.checks.findIndex(x=>!x);
  if(idx<0) return;
  cm.checks[idx]=true;
  if(cm.checks.every(Boolean)) cm.completed = true;
  markDayActive();
  persist('challenges');
  toast('Đã đánh dấu hôm nay!', '✅');
  renderProgressSub();
}

function answerQuiz(id, idx){
  const quiz = LESSON_QUIZ[id];
  const correct = idx===quiz.correct;
  const t = todayStr();
  let earned = 0;
  if(correct){
    earned = (state.games.lastQuizDate===t && state.games.quizzesToday>=5) ? 0 : 4;
    if(earned){ addPoints(earned,'Quiz bài '+id); }
  }
  if(state.games.lastQuizDate!==t){ state.games.quizzesToday=0; state.games.lastQuizDate=t; }
  state.games.quizzesToday++;
  persist('games');
  toast(correct? ('Chính xác! '+(earned?('+' +earned+' điểm'):'')) : 'Chưa đúng, không sao — bạn đã học thêm được điều mới!', correct?'✅':'💡');
  closeModal();
  render();
}

        <p style="font-weight:700;color:var(--ink);margin-bottom:6px;">Diễn đàn cần máy chủ thực</p>
        <p>Đây là bản thử nghiệm chỉ dùng LocalStorage trên trình duyệt của bạn, nên diễn đàn nhiều người dùng chưa thể hoạt động thật ở đây — để tránh giả lập một tính năng backend không tồn tại. Ở phiên bản chính thức, tính năng này sẽ cần hệ thống kiểm duyệt và máy chủ riêng.</p>
      </div>
    </div>`;
  }
}
function toggleNotif(v){ state.settings.notifEnabled=v; persist('settings'); }
function setNotifTime(v){ state.settings.notifTime=v; persist('settings'); }
function setTheme(t){ state.settings.theme=t; persist('settings'); applyTheme(); renderProfileSub(); }
function applyTheme(){
  let t = state.settings.theme;
  if(t==='system'){ t = window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; }
  document.body.classList.toggle('dark', t==='dark');
}
function exportData(){
  const all = {};
  Object.keys(KEYS).forEach(k=>{ all[k]=state[k]; });
  const blob = new Blob([JSON.stringify(all,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ecoreminder_data_'+todayStr()+'.json';
  a.click();
  toast('Đã xuất dữ liệu.', '📤');
}
function resetApp(){
  const html = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet">
      <h3>Xóa toàn bộ dữ liệu?</h3>
      <p style="margin:10px 0;font-size:13.5px;">Hành động này sẽ xóa toàn bộ hồ sơ, khảo sát, nhiệm vụ, điểm và tiến trình đã lưu trên trình duyệt này. Không thể hoàn tác.</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost btn-block" onclick="closeModal()">Hủy</button>
        <button class="btn btn-clay btn-block" onclick="confirmReset()">Xóa toàn bộ</button>
      </div>
      </div></div>`;
  document.getElementById('modalRoot').innerHTML = html;
}
function confirmReset(){
  Object.values(KEYS).forEach(k=>localStorage.removeItem(k));
  location.reload();
}
function openEditGoals(){
  uiState.tempGoals = [...state.profile.goals];
  const html = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet">
      <h3 style="margin-bottom:12px;">Chọn tối đa 3 mục tiêu</h3>
      <div class="chip-grid" id="goalEditGrid">${GOALS.map(g=>`<button class="chip ${uiState.tempGoals.includes(g.id)?'selected':''}" data-id="${g.id}" onclick="toggleGoalEdit('${g.id}')">${g.name}<small>${g.desc}</small></button>`).join('')}</div>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="saveGoals()">Lưu mục tiêu</button>
    </div></div>`;
  document.getElementById('modalRoot').innerHTML = html;
}
function toggleGoalEdit(id){
  const i = uiState.tempGoals.indexOf(id);
  if(i>=0) uiState.tempGoals.splice(i,1);
  else { if(uiState.tempGoals.length>=3){ toast('Chỉ chọn tối đa 3 mục tiêu.', '⚠️'); return; } uiState.tempGoals.push(id); }
  document.querySelectorAll('#goalEditGrid .chip').forEach(el=>el.classList.toggle('selected', uiState.tempGoals.includes(el.dataset.id)));
}
function saveGoals(){
  if(!uiState.tempGoals.length){ toast('Hãy chọn ít nhất một mục tiêu.', '⚠️'); return; }
  state.profile.goals = uiState.tempGoals;
  persist('profile');
  closeModal(); renderProfileSub();
  toast('Đã cập nhật mục tiêu.', '🎯');
}
function saveNickname(){
  const v = document.getElementById('editNickname').value.trim();
  if(!v){ toast('Nickname không được để trống.', '⚠️'); return; }
  state.profile.nickname = v;
  persist('profile');
  toast('Đã lưu.', '✅');
  render();
}

/* =========================================================================
   MINI CHECK-IN
   ========================================================================= */
function openCheckin(){
  uiState.checkinAnswers = {};
  uiState.checkinStep = 0;
  renderCheckinModal();
}
function renderCheckinModal(){
  const q = CHECKIN_QUESTIONS[uiState.checkinStep];
  const html = `<div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal-sheet">
      <p style="font-size:11.5px;font-weight:700;color:var(--moss);margin-bottom:4px;">MINI CHECK-IN · ${uiState.checkinStep+1}/${CHECKIN_QUESTIONS.length}</p>
      <h3 style="margin-bottom:14px;font-size:16.5px;">${q.text}</h3>
      ${q.opts.map(o=>`<button class="scenario-opt" onclick="answerCheckin('${q.id}', '${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
    </div></div>`;
  document.getElementById('modalRoot').innerHTML = html;
}
function answerCheckin(id, val){
  uiState.checkinAnswers[id] = val;
  uiState.checkinStep++;
  if(uiState.checkinStep>=CHECKIN_QUESTIONS.length){
    state.checkins.push({date:todayStr(), answers:uiState.checkinAnswers});
    persist('checkins');
    addPoints(5, 'Hoàn thành Mini Check-in');
    closeModal();
    toast('Cảm ơn bạn đã check-in! +5 điểm', '🙌');
    render();
  } else { renderCheckinModal(); }
}

/* =========================================================================
   SURVEY WIZARD (dùng chung cho khảo sát ban đầu và khảo sát sau)
   ========================================================================= */
function startSurvey(mode){
  uiState.surveyMode = mode; // 'initial' | 'post'
  uiState.surveyAnswers = {};
  uiState.surveyStepIdx = 0;
  uiState.surveySteps = mode==='initial' ? SURVEY_STEPS : POST_STEPS;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('onboarding').classList.remove('hidden');
  renderSurveyStep(true);
}
function surveyProgressPct(){
  return Math.round((uiState.surveyStepIdx/uiState.surveySteps.length)*100);
}
function renderSurveyStep(scrollTop){
  const savedY = window.scrollY; // nhớ vị trí cuộn hiện tại
  const wrap = document.getElementById('onboarding');
  const step = uiState.surveySteps[uiState.surveyStepIdx];
  let body = '';
  if(step.type==='bg'){
    body = step.questions.map((q,qi)=>`
      <div class="likert-q"><p class="qtext">${q.text}</p>
      ${q.opts.map((o,oi)=>`<button class="scenario-opt ${uiState.surveyAnswers['bg_'+qi]===oi?'selected':''}" onclick="setBgAnswer(${qi},${oi})">${o}</button>`).join('')}
      </div>`).join('');
  } else if(step.type==='likert'){
    body = step.items.map((txt,i)=>{
      const key = step.part+'_'+i;
      const val = uiState.surveyAnswers[key]||0;
      return `<div class="likert-q"><p class="qtext">${i+1}. ${txt}</p>
        <div class="likert-scale">${step.scale.map((lab,li)=>`
          <button class="likert-opt ${val===li+1?'selected':''}" onclick="setLikert('${key}',${li+1})"><span class="num">${li+1}</span>${lab}</button>`).join('')}
        </div></div>`;
    }).join('');
  } else if(step.type==='scenario'){
    body = step.scenarios.map((sc,si)=>{
      const key = 'scenario_'+si;
      const val = uiState.surveyAnswers[key];
      const letters=['A','B','C','D'];
      return `<div class="likert-q"><p style="font-weight:700;font-size:13px;color:var(--moss-dark);margin-bottom:4px;">${sc.title}</p>
        <p class="qtext">${sc.text}</p>
        ${sc.opts.map((o,oi)=>`<button class="scenario-opt ${val===letters[oi]?'selected':''}" onclick="setScenario(${si},'${letters[oi]}')"><b>${letters[oi]}.</b>${o}</button>`).join('')}
      </div>`;
    }).join('');
  } else if(step.type==='checklist'){
    body = `<div class="check-list">${step.options.map(o=>{
      const arr = uiState.surveyAnswers[step.part+'_checked']||[];
      return `<label><input type="checkbox" ${arr.includes(o.id)?'checked':''} onchange="toggleChecklist('${step.part}','${o.id}',${step.max||0})"><span>${o.t}</span></label>`;
    }).join('')}</div>`;
    } else if(step.type==='open'){
    body = `<textarea rows="4" style="width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;" placeholder="Chia sẻ của bạn (không bắt buộc)..." oninput="setOpen('${step.part}', this.value)">${uiState.surveyAnswers[step.part]||''}</textarea>`;
  }

  wrap.innerHTML = `
    <div style="max-width:640px;width:100%;">
      <div class="survey-progress-wrap" style="padding:0 0 14px;">
        <div class="survey-progress-label"><span>${step.title}</span><span>${uiState.surveyStepIdx+1}/${uiState.surveySteps.length}</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${surveyProgressPct()}%;"></div></div>
      </div>
      <div class="card">
        ${step.sub?`<p style="font-size:12.5px;margin-bottom:10px;">${step.sub}</p>`:''}
        ${body}
      </div>
      <div class="survey-nav">
        <button class="btn btn-ghost" onclick="surveyBack()">${uiState.surveyStepIdx===0?'Hủy':'Quay lại'}</button>
        <button class="btn btn-primary" onclick="surveyNext()">${uiState.surveyStepIdx===uiState.surveySteps.length-1?'Hoàn tất khảo sát':'Tiếp tục'}</button>
      </div>
    </div>
  `;
  window.scrollTo(0, scrollTop ? 0 : savedY); // chỉ cuộn lên đầu khi đổi bước
}
function setBgAnswer(qi, oi){ uiState.surveyAnswers['bg_'+qi]=oi; renderSurveyStep(); }
function setLikert(key, val){ uiState.surveyAnswers[key]=val; renderSurveyStep(); }
function setScenario(si, letter){ uiState.surveyAnswers['scenario_'+si]=letter; renderSurveyStep(); }
function setOpen(part, val){ uiState.surveyAnswers[part]=val; }
function toggleChecklist(part, id, max){
  const key = part+'_checked';
  let arr = uiState.surveyAnswers[key]||[];
  if(arr.includes(id)) arr = arr.filter(x=>x!==id);
  else { if(max && arr.length>=max){ toast('Chỉ chọn tối đa '+max+' mục.', '⚠️'); renderSurveyStep(); return; } arr.push(id); }
  uiState.surveyAnswers[key]=arr;
  renderSurveyStep();
}
function stepIsComplete(step){
  if(step.type==='bg') return step.questions.every((q,qi)=>uiState.surveyAnswers['bg_'+qi]!==undefined);
  if(step.type==='likert') return step.items.every((t,i)=>uiState.surveyAnswers[step.part+'_'+i]);
  if(step.type==='scenario') return step.scenarios.every((s,i)=>uiState.surveyAnswers['scenario_'+i]);
  return true; // checklist/open optional
}
function surveyBack(){
  if(uiState.surveyStepIdx===0){
    document.getElementById('onboarding').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    render();
    return;
  }
  uiState.surveyStepIdx--; renderSurveyStep(true);
}
function surveyNext(){
  const step = uiState.surveySteps[uiState.surveyStepIdx];
  if(!stepIsComplete(step)){ toast('Vui lòng trả lời đầy đủ các câu trước khi tiếp tục.', '⚠️'); return; }
  if(uiState.surveyStepIdx < uiState.surveySteps.length-1){ uiState.surveyStepIdx++; renderSurveyStep(true); }
  else finishSurvey();
}
function finishSurvey(){
  const scores = computeSurveyScores(uiState.surveyAnswers);
  const record = {
    userId: currentUser ? currentUser.uid : "anonymous",
    email: currentUser && !currentUser.isAnonymous ? currentUser.email : "Ẩn danh",
    nickname: state.profile ? state.profile.nickname : "Người dùng",
    answers: uiState.surveyAnswers,
    ...scores,
    completedAt: firebase.firestore.FieldValue.serverTimestamp()
  };

  const colName = uiState.surveyMode === 'initial' ? 'surveys_initial' : 'surveys_post';
  db.collection(colName).add(record).catch(e => console.error("Lỗi lưu Firestore:", e));

  if(uiState.surveyMode==='initial'){
    state.surveyInitial = record;
    persist('surveyInitial');
    if(!state.profile.goals || !state.profile.goals.length){
      document.getElementById('onboarding').classList.remove('hidden');
      renderGoalPicker();
      return;
    }
  } else {
    state.surveyPost = record;
    persist('surveyPost');
    addPoints(10, 'Hoàn thành khảo sát sau');
  }
  document.getElementById('onboarding').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  toast('Cảm ơn bạn đã hoàn thành khảo sát và lưu dữ liệu!', '🎉');
  switchTab(uiState.surveyMode==='initial'?'home':'progress');
}

/* =========================================================================
   ONBOARDING FLOW
   ========================================================================= */
let obStep = 'welcome'; // welcome -> intro -> profile -> survey -> goals -> done
function renderOnboarding(){
  const wrap = document.getElementById('onboarding');
  if(obStep==='welcome'){
    wrap.innerHTML = `<div class="ob-card">
      <div class="ob-hero">
        <span class="ob-leaf">🌱</span>
        <h1>Những hành động nhỏ hôm nay có thể trở thành thói quen xanh của ngày mai.</h1>
        <p>EcoReminder giúp bạn nhận diện rào cản và biến ý định giảm nhựa thành hành động thật, từng bước một.</p>
        <div class="ob-actions">
          <button class="btn btn-amber" onclick="obStep='intro'; renderOnboarding();">Bắt đầu</button>
          <button class="btn" style="background:rgba(255,255,255,.15);color:#fff;" onclick="obStep='intro2'; renderOnboarding();">Tìm hiểu thêm</button>
        </div>
      </div>
    </div>`;
  } else if(obStep==='intro2' || obStep==='intro'){
    wrap.innerHTML = `<div class="ob-card">
      <h2 style="margin-bottom:16px;">Cách EcoReminder đồng hành cùng bạn</h2>
      <div class="ob-steps">
        <div class="ob-step"><div class="ob-step-num">1</div><div><h4 style="font-size:14.5px;">Nhận diện rào cản</h4><p style="font-size:13px;margin-top:3px;">Tìm ra những khó khăn khiến bạn chưa thể duy trì hành động xanh.</p></div></div>
        <div class="ob-step"><div class="ob-step-num">2</div><div><h4 style="font-size:14.5px;">Nhiệm vụ nhỏ, phù hợp</h4><p style="font-size:13px;margin-top:3px;">Thực hiện những nhiệm vụ nhỏ, phù hợp với cuộc sống hằng ngày của bạn.</p></div></div>
        <div class="ob-step"><div class="ob-step-num">3</div><div><h4 style="font-size:14.5px;">Theo dõi tiến trình</h4><p style="font-size:13px;margin-top:3px;">Biến hành động nhỏ thành thói quen lâu dài, không phán xét khi bạn thất bại.</p></div></div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:22px;" onclick="obStep='profile'; renderOnboarding();">Tiếp tục</button>
    </div>`;
  } else if(obStep==='profile'){
    wrap.innerHTML = `<div class="ob-card">
      <h2 style="margin-bottom:18px;">Tạo hồ sơ của bạn</h2>
      <div class="card">
        <div class="field"><label>Tên hiển thị (nickname)</label><input type="text" id="obNickname" placeholder="Ví dụ: Minh Xanh"></div>
        <div class="field"><label>Bạn thuộc nhóm nào?</label>
          <select id="obGroup"><option>Học sinh THCS</option><option>Học sinh THPT</option><option>Sinh viên</option><option>Khác</option></select>
        </div>
        <div class="field"><label>Nhận thông báo nhắc nhở?</label>
          <div class="chip-grid"><button class="chip selected" id="notifYes" onclick="setObNotif(true)">Có</button><button class="chip" id="notifNo" onclick="setObNotif(false)">Không</button></div>
        </div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="submitProfile()">Tiếp tục</button>
    </div>`;
  }
}
let obNotif = true;
function setObNotif(v){ obNotif=v; document.getElementById('notifYes').classList.toggle('selected',v); document.getElementById('notifNo').classList.toggle('selected',!v); }
function submitProfile(){
  const nickname = document.getElementById('obNickname').value.trim();
  const userGroup = document.getElementById('obGroup').value;
  if(!nickname){ toast('Vui lòng nhập tên hiển thị.', '⚠️'); return; }
  state.profile = {id:uid(), nickname, userGroup, goals:[], notif:{enabled:obNotif, time:'08:00'}, createdAt:new Date().toISOString()};
  persist('profile');
  startSurvey('initial');
}
function renderGoalPicker(){
  uiState.tempGoals = [];
  const wrap = document.getElementById('onboarding');
  wrap.innerHTML = `<div class="ob-card">
    <h2 style="margin-bottom:6px;">Chọn mục tiêu cá nhân</h2>
    <p style="font-size:13.5px;margin-bottom:16px;">Chọn tối đa 3 mục tiêu bạn muốn tập trung — bạn có thể thay đổi bất cứ lúc nào trong Hồ sơ.</p>
    <div class="chip-grid" id="goalPickGrid">${GOALS.map(g=>`<button class="chip" data-id="${g.id}" onclick="pickGoal('${g.id}')">${g.name}<small>${g.desc}</small></button>`).join('')}</div>
    <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="finishGoals()">Vào Dashboard</button>
  </div>`;
}
function pickGoal(id){
  const i = uiState.tempGoals.indexOf(id);
  if(i>=0) uiState.tempGoals.splice(i,1);
  else { if(uiState.tempGoals.length>=3){ toast('Chỉ chọn tối đa 3 mục tiêu.', '⚠️'); return; } uiState.tempGoals.push(id); }
  document.querySelectorAll('#goalPickGrid .chip').forEach(el=>el.classList.toggle('selected', uiState.tempGoals.includes(el.dataset.id)));
}
function finishGoals(){
  if(!uiState.tempGoals.length){ toast('Hãy chọn ít nhất 1 mục tiêu.', '⚠️'); return; }
  state.profile.goals = uiState.tempGoals;
  persist('profile');
  document.getElementById('onboarding').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  toast('Chào mừng đến với EcoReminder!', '🎉');
  switchTab('home');
}

/* =========================================================================
   REMINDERS (in-app simulation — no backend / push)
   ========================================================================= */
function maybeShowReminder(){
  if(!state.settings.notifEnabled) return;
  const t = todayStr();
  if(state.settings.notifShownDate===t) return;
  const hour = new Date().getHours();
  let msg;
  if(hour<11) msg='Bạn đã chuẩn bị bình nước chưa?';
  else if(hour<14) msg='Nếu có thể, hãy dùng hộp hoặc dụng cụ cá nhân khi ăn trưa nhé.';
  else if(hour<18) msg='Bạn đã phân loại rác hôm nay chưa?';
  else msg='Hôm nay bạn đã thực hiện hành động xanh nào?';
  toast(msg, '🔔');
  state.settings.notifShownDate = t;
  persist('settings');
}

/* =========================================================================
   MAIN RENDER / INIT
   ========================================================================= */
function render(){
  renderNav();
  renderCurrentView();
}
function boot(){
  applyTheme();
  if(!state.profile){
    document.getElementById('app').classList.add('hidden');
    document.getElementById('onboarding').classList.remove('hidden');
    renderOnboarding();
  } else {
    document.getElementById('onboarding').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    _lastLevelName = levelOf(state.points.total).name;
    switchTab('home');
    setTimeout(maybeShowReminder, 800);
  }
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const cur = document.body.classList.contains('dark')?'dark':'light';
    setTheme(cur==='dark'?'light':'dark');
  });
}
window.addEventListener('DOMContentLoaded', boot);
</script>
